name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 签簿校验
        run: node tools/check-db.mjs
      - name: 脚本语法检查
        run: for f in public/js/*.js functions/api/*.js tools/*.mjs; do node --check "$f"; done
