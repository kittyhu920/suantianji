name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 签簿校验
        run: node tools/check-db.mjs
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 脚本语法检查
        run: for f in functions/api/*.js tools/*.mjs; do node --check "$f"; done
